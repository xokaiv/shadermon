name: AppImage Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, like v1.2.3"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libgtk-3-dev
            libglib2.0-dev
            libgirepository1.0-dev
            libxdo-dev
            libfuse2
            pkg-config
            build-essential
            wget
            file

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libxdo-dev \
            libfuse2 \
            pkg-config \
            build-essential \
            wget \
            file

      - name: Check libxdo version
        run: |
          ldconfig -p | grep libxdo || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-appimage
        run: cargo install cargo-appimage

      - name: Download appimagetool
        run: |
          ARCH=x86_64
          wget -O appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Link icon into crate root
        run: ln -sf assets/icon.png icon.png

      - name: Build AppImage
        run: cargo appimage

      - name: Find AppImage
        id: find_appimage
        run: |
          APPIMAGE=$(find target/appimage -name '*.AppImage' -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found in target/appimage"
            find target -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: shadermon-appimage
          path: ${{ steps.find_appimage.outputs.appimage }}

      - name: Create GitHub Release
        if: startsWith(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: ${{ steps.find_appimage.outputs.appimage }}
