name: AppImage Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: 

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >
            libgtk-3-dev
            libglib2.0-dev
            libgirepository1.0-dev
            libxdo-dev
            pkg-config
            build-essential
            wget
            file

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libxdo-dev \
            pkg-config \
            build-essential \
            wget \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-appimage
        run: cargo install cargo-appimage

      - name: Download appimagetool
        run: |
          ARCH=x86_64
          wget -O appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Link icon into crate root
        run: ln -sf assets/icon.png icon.png

      - name: Build AppImage
        run: cargo appimage

      - name: Find AppImage
        id: find_appimage
        run: |
          APPIMAGE=$(find . -name '*.AppImage' -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found after cargo appimage"
            ls -R .
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE"
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: shadermon-appimage
          path: ${{ steps.find_appimage.outputs.appimage }}
